apiVersion: apps/v1
kind: Deployment
metadata:
  name: outdated-service
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: outdated-service
  template:
    metadata:
      labels:
        app: outdated-service
    spec:
      containers:
      - name: app
        # ⚠️ PROBLEM: Using old image version - security vulnerabilities
        image: nginx:1.18  # Old version with known CVEs
        imagePullPolicy: IfNotPresent  # ⚠️ PROBLEM: May use cached old image
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
        # ⚠️ PROBLEM: No image pull secrets for private registry
        # ⚠️ PROBLEM: No image scanning configured


