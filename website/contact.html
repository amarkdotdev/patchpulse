<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - PatchPulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007AFF;
            --bg-primary: #000000;
            --bg-secondary: #1C1C1E;
            --text-primary: #FFFFFF;
            --text-secondary: #EBEBF5;
            --border: #38383A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 56px;
            font-weight: 900;
            margin-bottom: 20px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .contact-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
        }

        .contact-card h3 {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .contact-card p {
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .contact-card a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .contact-form {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Get in Touch</h1>
            <p style="font-size: 20px; color: var(--text-secondary);">We'd love to hear from you</p>
        </div>

        <div class="contact-grid">
            <div class="contact-card">
                <h3>📧 Email</h3>
                <p>General inquiries</p>
                <a href="mailto:hello@patchpulse.io">hello@patchpulse.io</a>
            </div>
            <div class="contact-card">
                <h3>🤝 Contributing</h3>
                <p>Want to contribute?</p>
                <a href="https://github.com/amarkdotdev/patchpulse" target="_blank">GitHub Repository</a>
            </div>
            <div class="contact-card">
                <h3>🆘 Support</h3>
                <p>Technical help</p>
                <a href="mailto:support@patchpulse.io">support@patchpulse.io</a>
            </div>
        </div>

        <div class="contact-form">
            <h2 style="margin-bottom: 32px; font-size: 32px;">Send us a message</h2>
            <form onsubmit="event.preventDefault(); alert('Thank you! We\'ll get back to you soon.');">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>
</body>
</html>
