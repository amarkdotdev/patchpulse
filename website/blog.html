<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - PatchPulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007AFF;
            --bg-primary: #000000;
            --bg-secondary: #1C1C1E;
            --text-primary: #FFFFFF;
            --text-secondary: #EBEBF5;
            --border: #38383A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 20px 40px;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: var(--primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 40px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .page-header h1 {
            font-size: 56px;
            font-weight: 900;
            margin-bottom: 20px;
        }

        .page-header p {
            font-size: 20px;
            color: var(--text-secondary);
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 32px;
            margin-bottom: 60px;
        }

        .post-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }

        .post-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.2);
        }

        .post-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--bg-primary);
        }

        .post-content {
            padding: 24px;
        }

        .post-meta {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .post-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .post-excerpt {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .tag {
            padding: 4px 12px;
            background: rgba(0, 122, 255, 0.1);
            border: 1px solid var(--primary);
            border-radius: 12px;
            font-size: 12px;
            color: var(--primary);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .admin-link {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
            transition: all 0.3s;
        }

        .admin-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 122, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="nav-container">
            <a href="/" class="logo">PatchPulse</a>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/about" class="nav-link">About</a>
                <a href="/blog" class="nav-link">Blog</a>
                <a href="/contact" class="nav-link">Contact</a>
                <a href="/login" class="nav-link">Log In</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>Blog</h1>
            <p>Latest insights on Kubernetes, DevOps, and SRE best practices</p>
        </div>

        <div id="postsContainer" class="posts-grid">
            <div class="empty-state">
                <h3>Loading posts...</h3>
            </div>
        </div>
    </div>

    <a href="/blog-admin" class="admin-link">✏️ Admin</a>

    <script>
        const API_BASE = window.location.origin;

        async function loadPosts() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/blog/posts?status=published`);
                const posts = await response.json();
                displayPosts(posts);
            } catch (e) {
                console.error('Failed to load posts:', e);
                document.getElementById('postsContainer').innerHTML = `
                    <div class="empty-state">
                        <h3>No blog posts yet</h3>
                        <p>Check back soon for updates!</p>
                    </div>
                `;
            }
        }

        function displayPosts(posts) {
            const container = document.getElementById('postsContainer');
            
            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No blog posts yet</h3>
                        <p>Check back soon for updates!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = posts.map(post => {
                const excerpt = post.excerpt || (post.content ? post.content.replace(/<[^>]*>/g, '').substring(0, 150) + '...' : '');
                const date = new Date(post.published_at || post.created_at).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                
                return `
                    <div class="post-card" onclick="viewPost('${post.slug}')">
                        ${post.featured_image ? `<img src="${post.featured_image}" alt="${post.title}" class="post-image">` : ''}
                        <div class="post-content">
                            <div class="post-meta">
                                <span>${date}</span>
                                <span>•</span>
                                <span>${post.author}</span>
                            </div>
                            <h2 class="post-title">${escapeHtml(post.title)}</h2>
                            <p class="post-excerpt">${escapeHtml(excerpt)}</p>
                            ${post.tags && post.tags.length > 0 ? `
                                <div class="post-tags">
                                    ${post.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function viewPost(slug) {
            window.location.href = `/blog/${slug}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadPosts();
    </script>
</body>
</html>
