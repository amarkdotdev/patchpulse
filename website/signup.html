<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PatchPulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007AFF;
            --bg-primary: #000000;
            --bg-secondary: #1C1C1E;
            --text-primary: #FFFFFF;
            --text-secondary: #EBEBF5;
            --border: #38383A;
            --success: #34C759;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .signup-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .signup-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .signup-header h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .signup-header p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }

        .password-requirements {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .signup-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .signup-btn:hover {
            background: #0051D5;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3);
        }

        .signup-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid #FF3B30;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: #FF3B30;
            font-size: 14px;
            display: none;
        }

        .success-message {
            background: rgba(52, 199, 89, 0.1);
            border: 1px solid var(--success);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: var(--success);
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-header">
            <h1>Create Account</h1>
            <p>Start your free trial today</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form onsubmit="handleSignup(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="John Doe">
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" placeholder="you@company.com" required>
            </div>

            <div class="form-group">
                <label>Company (Optional)</label>
                <input type="text" id="company" placeholder="Your Company">
            </div>

            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="password" placeholder="••••••••" required minlength="8">
                <div class="password-requirements">Must be at least 8 characters</div>
            </div>

            <button type="submit" class="signup-btn" id="signupBtn">Create Account</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="/login">Log in</a>
        </div>
    </div>

    <script>
        async function handleSignup(event) {
            event.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const company = document.getElementById('company').value;
            const password = document.getElementById('password').value;
            
            const signupBtn = document.getElementById('signupBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            // Hide previous messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Validate
            if (password.length < 8) {
                errorDiv.textContent = 'Password must be at least 8 characters';
                errorDiv.style.display = 'block';
                return;
            }
            
            signupBtn.textContent = 'Creating Account...';
            signupBtn.disabled = true;
            
            try {
                const response = await fetch('/api/v1/auth/signup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        full_name: fullName || null,
                        company: company || null
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    successDiv.textContent = 'Account created successfully! Redirecting...';
                    successDiv.style.display = 'block';
                    
                    // Auto-login after signup
                    setTimeout(async () => {
                        try {
                            const loginResponse = await fetch('/api/v1/auth/login', {
                                method: 'POST',
                                headers: {'Content-Type': 'application/json'},
                                body: JSON.stringify({email: email, password: password})
                            });
                            
                            if (loginResponse.ok) {
                                const loginData = await loginResponse.json();
                                localStorage.setItem('patchpulse_token', loginData.access_token);
                                localStorage.setItem('patchpulse_user', JSON.stringify(loginData.user));
                                window.location.href = '/dashboard';
                            } else {
                                window.location.href = '/login';
                            }
                        } catch (e) {
                            window.location.href = '/login';
                        }
                    }, 1500);
                } else {
                    const error = await response.json();
                    errorDiv.textContent = error.detail || 'Sign up failed. Please try again.';
                    errorDiv.style.display = 'block';
                    signupBtn.textContent = 'Create Account';
                    signupBtn.disabled = false;
                }
            } catch (e) {
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.style.display = 'block';
                signupBtn.textContent = 'Create Account';
                signupBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
