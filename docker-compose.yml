services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: patchpulse
      POSTGRES_USER: patchpulse
      POSTGRES_PASSWORD: patchpulse
    ports:
    - 5433:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U patchpulse
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: ./app/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://patchpulse:patchpulse@postgres:5432/patchpulse
      POLICY_MODE: advisory
      LOG_LEVEL: INFO
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
    env_file: null
    ports:
    - 8001:8000
    depends_on:
      postgres:
        condition: service_healthy
  agent:
    build:
      context: ./app/agent
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      KUBECONFIG: /root/.kube/config
    depends_on: null
  git-poller:
    build:
      context: ./app/integrations/git
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOS: ${GITHUB_REPOS:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.com/api/v4}
      GITLAB_PROJECTS: ${GITLAB_PROJECTS:-}
      POLL_INTERVAL: 60
    depends_on: null
  postgres_data: null
