apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: backend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: DATABASE_URL
          value: {{ .Values.env.DATABASE_URL | quote }}
        - name: POLICY_MODE
          value: {{ .Values.env.POLICY_MODE | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.env.LOG_LEVEL | quote }}
        {{- if .Values.env.OPENAI_API_KEY }}
        - name: OPENAI_API_KEY
          value: {{ .Values.env.OPENAI_API_KEY | quote }}
        {{- end }}
        {{- if .Values.env.DEEPSEEK_API_KEY }}
        - name: DEEPSEEK_API_KEY
          value: {{ .Values.env.DEEPSEEK_API_KEY | quote }}
        {{- end }}
        {{- if .Values.env.ANTHROPIC_API_KEY }}
        - name: ANTHROPIC_API_KEY
          value: {{ .Values.env.ANTHROPIC_API_KEY | quote }}
        {{- end }}
        {{- if .Values.env.GEMINI_API_KEY }}
        - name: GEMINI_API_KEY
          value: {{ .Values.env.GEMINI_API_KEY | quote }}
        {{- end }}
        {{- if .Values.env.OPENAI_BASE_URL }}
        - name: OPENAI_BASE_URL
          value: {{ .Values.env.OPENAI_BASE_URL | quote }}
        {{- end }}
        {{- if .Values.env.AI_PROVIDER }}
        - name: AI_PROVIDER
          value: {{ .Values.env.AI_PROVIDER | quote }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 10 }}

