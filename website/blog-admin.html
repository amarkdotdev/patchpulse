<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Admin - PatchPulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --primary: #007AFF;
            --bg-primary: #000000;
            --bg-secondary: #1C1C1E;
            --text-primary: #FFFFFF;
            --text-secondary: #EBEBF5;
            --border: #38383A;
            --success: #34C759;
            --danger: #FF3B30;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #0051D5;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #D70015;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .admin-header h1 {
            font-size: 36px;
            font-weight: 900;
        }

        .posts-list {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .post-item {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .post-item:last-child {
            border-bottom: none;
        }

        .post-info h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .post-meta {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            gap: 16px;
        }

        .post-actions {
            display: flex;
            gap: 8px;
        }

        .editor-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        #editor {
            background: white;
            min-height: 400px;
            border-radius: 8px;
        }

        .ql-container {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-published {
            background: rgba(52, 199, 89, 0.2);
            color: var(--success);
        }

        .status-draft {
            background: rgba(255, 149, 0, 0.2);
            color: #FF9500;
        }

        .status-archived {
            background: rgba(142, 142, 147, 0.2);
            color: #8E8E93;
        }

        .hidden {
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">PatchPulse Blog Admin</div>
        <div class="header-actions">
            <a href="/" class="btn btn-secondary">View Site</a>
            <button class="btn btn-primary" onclick="showEditor()">+ New Post</button>
        </div>
    </div>

    <div class="container">
        <div class="admin-header">
            <h1>Blog Posts</h1>
        </div>

        <div id="postsList" class="posts-list">
            <div class="empty-state">
                <h3>Loading posts...</h3>
            </div>
        </div>

        <div id="editorContainer" class="editor-container hidden">
            <h2 id="editorTitle" style="margin-bottom: 24px; font-size: 28px;">New Blog Post</h2>
            
            <form id="postForm" onsubmit="savePost(event)">
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" id="postTitle" required placeholder="Enter post title">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Slug</label>
                        <input type="text" id="postSlug" placeholder="auto-generated from title">
                    </div>
                    <div class="form-group">
                        <label>Author</label>
                        <input type="text" id="postAuthor" value="PatchPulse Team">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Status</label>
                        <select id="postStatus">
                            <option value="published">Published</option>
                            <option value="draft">Draft</option>
                            <option value="archived">Archived</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Featured Image URL</label>
                        <input type="url" id="postImage" placeholder="https://example.com/image.jpg">
                    </div>
                </div>

                <div class="form-group">
                    <label>Excerpt</label>
                    <textarea id="postExcerpt" rows="3" placeholder="Short summary of the post"></textarea>
                </div>

                <div class="form-group">
                    <label>Content *</label>
                    <div id="editor"></div>
                </div>

                <div class="form-group">
                    <label>Tags (comma-separated)</label>
                    <input type="text" id="postTags" placeholder="kubernetes, devops, sre">
                </div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" class="btn btn-primary">Save Post</button>
                    <button type="button" class="btn btn-secondary" onclick="cancelEdit()">Cancel</button>
                    <button type="button" id="deleteBtn" class="btn btn-danger hidden" onclick="deletePost()">Delete</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        const API_BASE = window.location.origin;
        let quill;
        let editingPostId = null;

        // Initialize Quill editor
        quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'script': 'sub'}, { 'script': 'super' }],
                    [{ 'indent': '-1'}, { 'indent': '+1' }],
                    [{ 'direction': 'rtl' }],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'font': [] }],
                    [{ 'align': [] }],
                    ['link', 'image', 'video', 'code-block'],
                    ['clean']
                ]
            }
        });

        // Load posts
        async function loadPosts() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/blog/posts`);
                const posts = await response.json();
                displayPosts(posts);
            } catch (e) {
                console.error('Failed to load posts:', e);
                document.getElementById('postsList').innerHTML = 
                    '<div class="empty-state"><h3>Error loading posts</h3></div>';
            }
        }

        function displayPosts(posts) {
            const container = document.getElementById('postsList');
            
            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No blog posts yet</h3>
                        <p>Click "New Post" to create your first post</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="post-item">
                    <div class="post-info">
                        <h3>${escapeHtml(post.title)}</h3>
                        <div class="post-meta">
                            <span>By ${escapeHtml(post.author)}</span>
                            <span>•</span>
                            <span>${new Date(post.created_at).toLocaleDateString()}</span>
                            <span>•</span>
                            <span class="status-badge status-${post.status}">${post.status}</span>
                        </div>
                    </div>
                    <div class="post-actions">
                        <button class="btn btn-secondary" onclick="editPost('${post.id}')">Edit</button>
                        <button class="btn btn-danger" onclick="deletePostConfirm('${post.id}', '${escapeHtml(post.title)}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function showEditor(postId = null) {
            editingPostId = postId;
            const container = document.getElementById('editorContainer');
            const title = document.getElementById('editorTitle');
            const deleteBtn = document.getElementById('deleteBtn');
            
            container.classList.remove('hidden');
            container.scrollIntoView({ behavior: 'smooth' });
            
            if (postId) {
                title.textContent = 'Edit Blog Post';
                deleteBtn.classList.remove('hidden');
                loadPost(postId);
            } else {
                title.textContent = 'New Blog Post';
                deleteBtn.classList.add('hidden');
                resetForm();
            }
        }

        function cancelEdit() {
            document.getElementById('editorContainer').classList.add('hidden');
            editingPostId = null;
            resetForm();
        }

        function resetForm() {
            document.getElementById('postForm').reset();
            quill.setContents([]);
            document.getElementById('postAuthor').value = 'PatchPulse Team';
            document.getElementById('postStatus').value = 'published';
        }

        async function loadPost(postId) {
            try {
                const response = await fetch(`${API_BASE}/api/v1/blog/posts/${postId}`);
                const post = await response.json();
                
                document.getElementById('postTitle').value = post.title;
                document.getElementById('postSlug').value = post.slug;
                document.getElementById('postAuthor').value = post.author;
                document.getElementById('postStatus').value = post.status;
                document.getElementById('postImage').value = post.featured_image || '';
                document.getElementById('postExcerpt').value = post.excerpt || '';
                document.getElementById('postTags').value = (post.tags || []).join(', ');
                
                quill.root.innerHTML = post.content;
            } catch (e) {
                console.error('Failed to load post:', e);
                alert('Failed to load post');
            }
        }

        async function savePost(event) {
            event.preventDefault();
            
            const title = document.getElementById('postTitle').value;
            const slug = document.getElementById('postSlug').value || null;
            const author = document.getElementById('postAuthor').value;
            const status = document.getElementById('postStatus').value;
            const image = document.getElementById('postImage').value || null;
            const excerpt = document.getElementById('postExcerpt').value || null;
            const tags = document.getElementById('postTags').value
                .split(',')
                .map(t => t.trim())
                .filter(t => t);
            const content = quill.root.innerHTML;

            const postData = {
                title,
                slug,
                author,
                status,
                featured_image: image,
                excerpt,
                tags: tags.length > 0 ? tags : null,
                content
            };

            try {
                let response;
                if (editingPostId) {
                    response = await fetch(`${API_BASE}/api/v1/blog/posts/${editingPostId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(postData)
                    });
                } else {
                    response = await fetch(`${API_BASE}/api/v1/blog/posts`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(postData)
                    });
                }

                if (response.ok) {
                    alert(editingPostId ? 'Post updated successfully!' : 'Post created successfully!');
                    cancelEdit();
                    loadPosts();
                } else {
                    const error = await response.json();
                    alert(`Error: ${error.detail || 'Failed to save post'}`);
                }
            } catch (e) {
                console.error('Failed to save post:', e);
                alert('Failed to save post');
            }
        }

        function editPost(postId) {
            showEditor(postId);
        }

        function deletePostConfirm(postId, title) {
            if (confirm(`Are you sure you want to delete "${title}"?`)) {
                deletePost(postId);
            }
        }

        async function deletePost(postId = null) {
            const id = postId || editingPostId;
            if (!id) return;

            if (!confirm('Are you sure you want to delete this post? This action cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/v1/blog/posts/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('Post deleted successfully!');
                    cancelEdit();
                    loadPosts();
                } else {
                    const error = await response.json();
                    alert(`Error: ${error.detail || 'Failed to delete post'}`);
                }
            } catch (e) {
                console.error('Failed to delete post:', e);
                alert('Failed to delete post');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Auto-generate slug from title
        document.getElementById('postTitle').addEventListener('input', function(e) {
            if (!editingPostId && !document.getElementById('postSlug').value) {
                const slug = e.target.value
                    .toLowerCase()
                    .replace(/[^\w\s-]/g, '')
                    .replace(/[-\s]+/g, '-')
                    .trim();
                document.getElementById('postSlug').value = slug;
            }
        });

        // Load posts on page load
        loadPosts();
    </script>
</body>
</html>
