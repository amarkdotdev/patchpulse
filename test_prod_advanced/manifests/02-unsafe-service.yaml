apiVersion: v1
kind: Service
metadata:
  name: critical-api-service
  namespace: production
spec:
  type: LoadBalancer  # ⚠️ PROBLEM: Expensive LoadBalancer instead of ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: critical-api
  # ⚠️ PROBLEM: No session affinity configured
  # ⚠️ PROBLEM: No health checks

---
apiVersion: v1
kind: Service
metadata:
  name: internal-api
  namespace: production
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: internal-api
  # ⚠️ PROBLEM: Exposed to all namespaces (no network policies)

