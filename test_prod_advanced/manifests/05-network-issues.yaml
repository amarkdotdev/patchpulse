apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all
  namespace: production
spec:
  # ⚠️ PROBLEM: Allows all traffic - no security
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - {}  # Allow all ingress
  egress:
  - {}  # Allow all egress

---
apiVersion: v1
kind: Pod
metadata:
  name: host-network-pod
  namespace: production
spec:
  # ⚠️ PROBLEM: Uses host network - security risk
  hostNetwork: true
  containers:
  - name: network-tool
    image: nginx:latest
    securityContext:
      capabilities:
        add:
        - NET_ADMIN  # ⚠️ PROBLEM: Dangerous capability
        - NET_RAW    # ⚠️ PROBLEM: Dangerous capability

