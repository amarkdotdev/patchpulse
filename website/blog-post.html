<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post - PatchPulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007AFF;
            --bg-primary: #000000;
            --bg-secondary: #1C1C1E;
            --text-primary: #FFFFFF;
            --text-secondary: #EBEBF5;
            --border: #38383A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 20px 40px;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .post-header {
            margin-bottom: 40px;
        }

        .post-meta {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .post-title {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 24px;
            line-height: 1.2;
        }

        .post-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 40px;
        }

        .post-content {
            font-size: 18px;
            line-height: 1.8;
        }

        .post-content h1, .post-content h2, .post-content h3 {
            margin-top: 32px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .post-content h1 { font-size: 36px; }
        .post-content h2 { font-size: 28px; }
        .post-content h3 { font-size: 24px; }

        .post-content p {
            margin-bottom: 20px;
        }

        .post-content img {
            max-width: 100%;
            border-radius: 8px;
            margin: 24px 0;
        }

        .post-content a {
            color: var(--primary);
            text-decoration: none;
        }

        .post-content a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            color: var(--primary);
            text-decoration: none;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="nav-container">
            <a href="/" class="logo">PatchPulse</a>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/blog" class="nav-link">Blog</a>
            </div>
        </div>
    </div>

    <div class="container">
        <a href="/blog" class="back-link">← Back to Blog</a>
        <div id="postContainer">
            <div style="text-align: center; padding: 60px 20px;">
                <h2>Loading post...</h2>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const slug = window.location.pathname.replace('/blog/', '');

        async function loadPost() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/blog/posts/slug/${slug}`);
                if (!response.ok) {
                    throw new Error('Post not found');
                }
                const post = await response.json();
                displayPost(post);
            } catch (e) {
                document.getElementById('postContainer').innerHTML = `
                    <div style="text-align: center; padding: 60px 20px;">
                        <h2>Post not found</h2>
                        <p style="color: var(--text-secondary); margin-top: 12px;">
                            The blog post you're looking for doesn't exist.
                        </p>
                        <a href="/blog" style="display: inline-block; margin-top: 24px; color: var(--primary);">← Back to Blog</a>
                    </div>
                `;
            }
        }

        function displayPost(post) {
            const date = new Date(post.published_at || post.created_at).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            document.title = `${post.title} - PatchPulse Blog`;

            document.getElementById('postContainer').innerHTML = `
                <div class="post-header">
                    <div class="post-meta">
                        ${date} • ${post.author}
                    </div>
                    <h1 class="post-title">${escapeHtml(post.title)}</h1>
                </div>
                ${post.featured_image ? `<img src="${post.featured_image}" alt="${post.title}" class="post-image">` : ''}
                <div class="post-content">
                    ${post.content}
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadPost();
    </script>
</body>
</html>
