# Test deployment with issues for PatchPulse to detect
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: patchpulse
  labels:
    app: test-app
spec:
  replicas: 1  # ⚠️ Only 1 replica
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
      - name: app
        image: nginx:latest  # ⚠️ Latest tag
        resources:
          requests:
            memory: "100Mi"
          # ⚠️ Missing limits
        securityContext:
          privileged: true  # ⚠️ Privileged
          runAsUser: 0  # ⚠️ Root user
        ports:
        - containerPort: 80
        env:
        - name: API_KEY
          value: "hardcoded-secret-123"  # ⚠️ Hardcoded secret
        - name: DEBUG_MODE
          value: "true"  # ⚠️ Debug mode
---
apiVersion: v1
kind: Service
metadata:
  name: test-app
  namespace: patchpulse
spec:
  selector:
    app: test-app
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer  # ⚠️ Expensive LoadBalancer

